name: Monitor de Salidas

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  monitor:
    name: Ejecutar monitor de salidas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python main.py

      - name: Subir HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salidas-monitor-${{ github.run_id }}
          path: SALIDAS_MONITOR.html
          retention-days: 30

      - name: Notificar resultado (solo en fallo)
        if: failure()
        run: echo "::error::El monitor de salidas falló. Revisar logs arriba."

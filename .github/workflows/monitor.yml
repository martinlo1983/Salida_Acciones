name: Monitor de Salidas

on:
  schedule:
    # Lunes a viernes a las 21:30 UTC (cierre NYSE ~21:00 UTC)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  monitor:
    name: Ejecutar monitor de salidas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        working-directory: scripts
        run: python main.py

      - name: Notificar resultado (solo en fallo)
        if: failure()
        run: echo "::error::El monitor de salidas falló. Revisar logs arriba."
